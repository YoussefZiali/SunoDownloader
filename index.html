    <script>
      (function() {
        try {
          if (typeof window !== 'undefined' && window.fetch) {
            var originalFetch = window.fetch.bind(window);
            var activeFetch = originalFetch;
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return activeFetch || originalFetch;
              },
              set: function(fn) {
                activeFetch = typeof fn === 'function' ? fn : originalFetch;
              },
              configurable: true,
              enumerable: true,
            });
          }
        } catch (e) {
          // Graceful fallback
        }
      })();
    </script>
